<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天翼之鍊倖存者</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft JhengHei", sans-serif; user-select: none; }
    body { background: #0f172a; color: #f8fafc; overflow: hidden; }
    canvas { display: block; }
    #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-box { background: rgba(15, 23, 42, 0.85); border: 1px solid #475569; border-radius: 10px; padding: 8px 12px; }
    #banner { position: fixed; top: 82px; left: 50%; transform: translateX(-50%); background: rgba(180, 83, 9, 0.94); border: 2px solid #facc15; padding: 8px 20px; border-radius: 999px; font-weight: bold; display: none; z-index: 15; }
    .modal { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.86); display: none; align-items: center; justify-content: center; z-index: 30; }
    .panel { background: #1e293b; border: 2px solid #eab308; border-radius: 14px; padding: 18px; width: min(1040px, 95vw); max-height: 92vh; overflow-y: auto; }
    .lobby-grid { display: grid; grid-template-columns: 1fr 1.15fr 1.15fr; gap: 12px; margin-top: 12px; }
    .lobby-col { background: rgba(15, 23, 42, 0.72); border: 1px solid #334155; border-radius: 10px; padding: 10px; max-height: 58vh; overflow-y: auto; }
    .stat-row, .eq-slot, .bag-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; margin-bottom: 5px; background: rgba(30, 41, 59, 0.8); border-radius: 6px; font-size: 13px; }
    .stat-btn { background: #38bdf8; color: #0f172a; border: none; border-radius: 4px; width: 24px; height: 22px; font-weight: bold; cursor: pointer; }
    .stat-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
    .card { background: #0f172a; border: 2px solid #475569; border-radius: 12px; padding: 14px; cursor: pointer; transition: 0.15s; }
    .card:hover { border-color: #facc15; transform: translateY(-3px); }
    .card-key { font-size: 11px; color: #facc15; margin-bottom: 4px; }
    .card-title { font-size: 15px; font-weight: bold; color: #fef08a; margin-bottom: 6px; }
    .card-desc { font-size: 12px; color: #cbd5e1; line-height: 1.5; }
    .card-tag { margin-top: 8px; font-size: 11px; color: #38bdf8; }
    .status-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 10px; }
    .status-sec { background: rgba(15, 23, 42, 0.78); border: 1px solid #334155; border-radius: 10px; padding: 10px; font-size: 13px; line-height: 1.6; min-width: 0; overflow: hidden; }
  </style>
</head>
<body>
  <!-- ==================== 1. 登入與角色選擇頁面 (core/login.js) ==================== -->
<div id="login-select-view" style="display:none;position:fixed;inset:0;background:#0f172a;z-index:900;flex-direction:column;align-items:center;justify-content:center;color:#f8fafc;">
  <h1 style="font-size:28px;color:#38bdf8;margin-bottom:6px;">⚔️ 《天翼之鍊倖存者》角色選擇大廳</h1>
  <p style="font-size:13px;color:#94a3b8;margin-bottom:20px;">請選擇本次登入的角色，確認後將進入卡雷德自由市場</p>
  <div id="login-char-grid" style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:960px;"></div>
  <button onclick="confirmEnterTownFromLogin()" style="margin-top:24px;padding:12px 36px;font-size:16px;font-weight:bold;background:#2563eb;color:#fff;border:none;border-radius:10px;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,0.4);">
      ✨ 進入卡雷德自由市場
  </button>
</div>

<!-- ==================== 2. 卡雷德自由市場互動舞台 (core/town.js) ==================== -->
<div id="town-clad-view" style="display:none;position:fixed;inset:0;background:#0b1120;z-index:850;flex-direction:column;align-items:center;justify-content:center;">
  <div id="town-header-status" style="width:100%;max-width:1280px;padding:10px 16px;background:#1e293b;border-bottom:1px solid #334155;color:#f8fafc;font-size:14px;display:flex;align-items:center;flex-wrap:wrap;"></div>
  <canvas id="town-canvas" width="1280" height="820" style="width:100%;max-width:1280px;max-height:calc(100vh - 52px);background:#1e293b;border:1px solid #334155;cursor:pointer;"></canvas>
</div>

<!-- ==================== 3. 傳送門：關卡出征新頁面 (core/stage_select.js) ==================== -->
<div id="stage-select-view" style="display:none;position:fixed;inset:0;background:#0f172a;z-index:880;flex-direction:column;align-items:center;justify-content:center;color:#f8fafc;padding:20px;">
  <div style="width:100%;max-width:680px;background:#1e293b;border:2px solid #38bdf8;border-radius:14px;padding:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;padding-bottom:10px;margin-bottom:12px;">
          <h2 style="margin:0;font-size:20px;color:#38bdf8;">🌌 卡雷德自由市場傳送門 — 關卡出征</h2>
          <button onclick="closeStageSelectPage()" style="padding:5px 12px;background:#334155;color:#fff;border:none;border-radius:6px;cursor:pointer;">⬅ 返回卡雷德市集</button>
      </div>
      <div id="stage-player-summary" style="font-size:13px;color:#cbd5e1;margin-bottom:14px;"></div>
      <div id="stage-cards-container"></div>
      <div style="margin-top:16px;">
          <button onclick="launchSelectedStage()" style="width:100%;padding:12px;font-size:16px;font-weight:bold;background:#16a34a;color:#fff;border:none;border-radius:8px;cursor:pointer;">⚔️ 正式出征</button>
      </div>
  </div>
</div>

<!-- ==================== 4. 通用 NPC 互動視窗容器 (npc/npc_*.js 共用) ==================== -->
<div id="npc-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:950;align-items:center;justify-content:center;padding:16px;">
  <div id="npc-modal-box" style="width:100%;max-width:720px;background:#0f172a;border:2px solid #facc15;border-radius:12px;padding:18px;color:#f8fafc;box-shadow:0 10px 30px rgba(0,0,0,0.6);"></div>
</div>

  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hud-box"></div>
    <div class="hud-box" style="text-align:right;font-size:13px;line-height:1.5;">
      <div id="timeText" style="font-size:18px;font-weight:bold;color:#fde047;">00:00</div>
      <div>擊殺：<strong id="killText">0</strong> ｜ 連擊：<strong id="comboText">0</strong></div>
      <div style="font-size:11px;color:#94a3b8;">[ESC/P]角色狀態 [L]升級 [B]精英王 [G]狂暴王 [T]+1分</div>
    </div>
  </div>
  <div id="banner"></div>
  <!-- 卡雷德準備大廳 -->
  <div id="lobbyModal" class="modal" style="display:flex;">
    <div class="panel">
      <h2 style="color:#fde047;text-align:center;">⚔ TW倖存者 — 卡雷德準備大廳（V2.9）</h2>
      <div id="lobbyHeader" style="text-align:center;font-size:13px;color:#cbd5e1;margin-top:6px;"></div>
      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px;">
        <button class="stat-btn" style="width:auto;padding:4px 10px;background:#64748b;color:#fff;" onclick="resetStats()">🔄 洗點</button>
        <button class="stat-btn" style="width:auto;padding:4px 10px;" onclick="debugAddExp()">[測試]+1級＆Seed</button>
        <button class="stat-btn" style="width:auto;padding:4px 10px;background:#a855f7;color:#fff;" onclick="debugDropLoot()">[測試]掉落5件裝備</button>
        <button class="stat-btn" style="width:auto;padding:4px 10px;background:#ef4444;color:#fff;" onclick="hardResetSave()">🗑 重置存檔</button>
        <button class="stat-btn" style="width:auto;padding:4px 10px;background:#facc15;" onclick="debugMaxLv60()">⚡ [測試]一鍵255等</button>
        <button class="stat-btn" style="width:auto;padding:4px 10px;background:#22c55e;" onclick="toggleCharDetailModal(true)">📊 角色詳細資訊</button>
      </div>
      <div class="lobby-grid">
        <div class="lobby-col"><h3 style="color:#38bdf8;margin-bottom:8px;">📊 七大素質配點</h3><div id="statRows"></div></div>
        <div class="lobby-col"><h3 style="color:#4ade80;margin-bottom:8px;">🛡 8 格裝備與紙娃娃</h3><div id="lobbyPreview"></div></div>
        <div class="lobby-col">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <h3 style="color:#facc15;">🔍 鑑定工坊與背包</h3>
            <button class="stat-btn" style="width:auto;padding:3px 8px;background:#eab308;" onclick="identifyAllItems()">✨ 一鍵全部鑑定</button>
          </div>
          <div id="bagList"></div>
        </div>
      </div>
      <div style="text-align:center;margin-top:14px;">
        <button class="stat-btn" style="width:220px;height:38px;font-size:16px;background:#ef4444;color:#fff;" onclick="startBattle()">🔥 出發冒險</button>
      </div>
    </div>
  </div>

  <!-- 升級選卡視窗 -->
  <div id="levelModal" class="modal">
    <div class="panel" style="max-width:780px;">
      <h2 style="color:#fde047;text-align:center;">✨ 選擇強化</h2>
      <div id="modalSub" style="text-align:center;font-size:13px;color:#94a3b8;margin-top:4px;">點擊一張卡片，或按鍵盤 1 / 2 / 3</div>
      <div id="cardContainer" class="card-grid"></div>
    </div>
  </div>

  <!-- 角色詳細資訊視窗 -->
  <div id="charDetailModal" class="modal">
    <div class="panel" style="max-width:760px;">
      <h2 style="color:#fde047;text-align:center;">📊 角色完整素質與公式明細</h2>
      <div id="charDetailContent" class="status-grid"></div>
      <div style="text-align:center;margin-top:12px;">
        <button class="stat-btn" style="width:140px;height:32px;" onclick="toggleCharDetailModal(false)">關閉視窗</button>
      </div>
    </div>
  </div>
  <!-- ESC 暫停狀態面板 -->
  <div id="pauseModal" class="modal">
    <div class="panel" style="max-width:860px;">
      <h2 style="color:#fde047;text-align:center;">⏸ 遊戲暫停 — 角色即時狀態</h2>
      <div id="pauseContent" class="status-grid"></div>
      <div style="text-align:center;margin-top:14px;">
        <button class="stat-btn" style="width:180px;height:34px;background:#22c55e;" onclick="togglePause()">繼續戰鬥 (ESC / P)</button>
      </div>
    </div>
  </div>

  <!-- 結算視窗 -->
  <div id="endModal" class="modal">
    <div class="panel" style="max-width:520px;text-align:center;">
      <h2 id="endTitle" style="color:#fde047;">天翼斷裂</h2>
      <div id="endSummary" style="margin:14px 0;font-size:14px;line-height:1.7;"></div>
      <button class="stat-btn" style="width:160px;height:36px;background:#38bdf8;" onclick="location.reload()">返回準備大廳</button>
    </div>
  </div>

      <!-- ==================== 1. 靜態資料庫 (data/) ==================== -->
      <script src="data/characters.js"></script>
      <script src="data/raw_tw_skills.js"></script>
      <script src="data/town_clad.js"></script>
      <script src="data/weapons/item_weapon_swords.js"></script>
      <script src="data/weapons/item_weapon_heavy.js"></script>
      <script src="data/weapons/item_weapon_light.js"></script>
      <script src="data/weapons/item_weapon_magic.js"></script>
      <script src="data/weapons/item_weapons.js"></script>
      <script src="data/armors/armor_body.js"></script>
      <script src="data/armors/armor_parts.js"></script>
      <script src="data/armors/armor_sub.js"></script>
      <script src="data/armors/armor_special.js"></script>
      <script src="data/armors/armor_wings.js"></script>
      <script src="data/armors/item_armors.js"></script>
      <script src="data/item_sets.js"></script>
      <script src="data/item_event.js"></script>
      <script src="data/item_consumable.js"></script>
  
      <!-- ==================== 2. 技能卡池資料庫 (skills/) ==================== -->
      <script src="skills/skill_common.js"></script>
      <script src="skills/skill_tichiel.js"></script>
      <script src="skills/skill_lucien.js"></script>
  
      <!-- ==================== 3. 系統引擎層 (systems/) ==================== -->
      <script src="systems/equip.js"></script>
      <script src="systems/ui_battle.js"></script>
  
      <!-- ==================== 4. 局內核心戰鬥與存檔引擎 (core/) ==================== -->
      <script src="core/save.js"></script>
      <script src="core/resonance.js"></script>
      <script src="core/combat.js"></script>
      <script src="core/skill_exec.js"></script>
      <script src="core/render.js"></script>
      <script src="core/sandbox.js"></script>
      <script src="core/game.js"></script>
  
      <!-- ==================== 5. 局外城鎮、選角、選關與獨立 NPC (town/) ==================== -->
      <script src="town/town.js"></script>
      <script src="town/login.js"></script>
      <script src="town/stage_select.js"></script>
      <script src="town/NPC/npc_pio.js"></script>
      <script src="town/NPC/npc_kalipa.js"></script>
      <script src="town/NPC/npc_bahari.js"></script>
      <script src="town/NPC/npc_hannah.js"></script> 
      <script>
        window.addEventListener('load', () => {
            const oldLobby = document.getElementById('lobbyModal');
            if (oldLobby) oldLobby.style.display = 'none';
            const sbBtn = document.getElementById('btnEnterSandbox');
            if (sbBtn) sbBtn.style.display = 'none';
            if (typeof openLoginSelectScreen === 'function') {
                openLoginSelectScreen();
            }
        });
    </script>
</body>
</html>
